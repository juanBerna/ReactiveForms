<h1 class="mt-3 text-2xl font-bold tracking-tight text-slate-900">Selectores anidados</h1>
<hr class="my-6 border-slate-200" />

<form>
  <!-- Region -->
  <div class="mb-5">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">Continente:</label>
      <select formControlName="region" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
        <option value="">-- Seleccione Continente --</option>

        <!-- <option [value]="region">
          {{ region }}
        </option> -->

      </select>
    </div>
  </div>

  <!-- Countries -->

  <div class="mb-5">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">País:</label>
      <select formControlName="country" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
        <option value="">-- Seleccione País --</option>

        <!-- <option [value]="country.cca3">
          {{ country.name }}
        </option> -->

      </select>
    </div>
  </div>


  <!-- Countries -->

  <div class="mb-5">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">Fronteras:</label>
      <select formControlName="border" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 shadow-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
        <option value="">-- Seleccione la frontera --</option>


        <!-- <option [value]="country.cca3">
          {{ country.name }}
        </option> -->
      </select>
    </div>
  </div>

</form>
