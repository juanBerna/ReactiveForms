<h2 class="text-2xl font-bold tracking-tight text-slate-900">Reactivos: Switches</h2>
<hr class="my-6 border-slate-200">


<form autocomplete="off" [formGroup]="formSwitches">

    <!-- Radio -->
    <div class="mb-5 grid max-w-3xl gap-2 sm:grid-cols-[minmax(9rem,25%)_1fr] sm:items-start">
        <label class="pt-2 text-sm font-medium text-slate-700">Género</label>
        <div>

            <div class="flex items-center gap-2">
                <input class="h-4 w-4 accent-sky-600"
                       type="radio"
                       value="M"
                       id="radioMasculino"
                       formControlName="gender">
                <label class="text-sm text-slate-700" for="radioMasculino">
                  Masculino
                </label>
            </div>

            <div class="mt-2 flex items-center gap-2">
                <input class="h-4 w-4 accent-sky-600"
                       type="radio"
                       value="F"
                       id="radioFemenino"
                       formControlName="gender">
                <label class="text-sm text-slate-700" for="radioFemenino">
                  Femenino
                </label>
            </div>

        </div>
    </div>

    <!-- Switches -->
    <div class="mb-5 grid max-w-3xl gap-2 sm:grid-cols-[minmax(9rem,25%)_1fr] sm:items-start">
        <label class="pt-2 text-sm font-medium text-slate-700">Notificaciones</label>
        <div>

            <div class="mt-2 flex items-center gap-2">
                <input class="h-4 w-4 accent-sky-600"
                       type="checkbox"
                       id="flexSwitchCheckChecked"
                       formControlName="notifications">
                <label class="text-sm text-slate-700" for="flexSwitchCheckChecked">Quiero recibir notificaciones</label>
            </div>

        </div>
    </div>

    <!-- Switches -->
    <div class="mb-5 grid max-w-3xl gap-2 sm:grid-cols-[minmax(9rem,25%)_1fr] sm:items-start">
        <label class="pt-2 text-sm font-medium text-slate-700"></label>
        <div>
            <div class="flex items-center gap-2">
                <input class="h-4 w-4 accent-sky-600"
                       type="checkbox"
                       id="flexCheckDefault"
                       formControlName="terms">
                <label class="text-sm text-slate-700" for="flexCheckDefault">
                  Términos y condiciones de uso
                </label>
              </div>
              @if( formUtils.isValidField(formSwitches, 'terms')) {
              <span class="mt-1 block text-sm text-red-600">
                 Debe de aceptar las condiciones de uso
              </span>
            }
        </div>
    </div>


    <!-- Boton submit -->
    <div class="flex max-w-3xl justify-end">
        <div>
            <button (click)="Guardar()" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300"
                    type="submit">
                Guardar
            </button>
        </div>
    </div>

</form>


<h5>Valor del formulario</h5>
<pre>{{ formSwitches.value | json }}</pre>
<br>

<h5>Persona</h5>
<pre>{{ formSwitches.controls['gender'].value | json }}</pre>
<br>

<h5>Valid</h5>
<pre>{{ formSwitches.valid | json }}</pre>
