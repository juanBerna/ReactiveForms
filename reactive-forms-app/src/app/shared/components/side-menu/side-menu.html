<h2 class="text-xl font-bold tracking-tight text-slate-900">Páginas</h2>
<hr class="my-4 border-slate-200">
<h3 class="mt-6 text-xs font-semibold uppercase tracking-wider text-slate-500">Reactive</h3>
<ul class="mt-2 space-y-1">
  @for (item of reactiveMenu; track item.title) {

    <li class="cursor-pointer rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
    [routerLink]="item.route"
    routerLinkActive="bg-sky-100 text-sky-700 font-semibold">
      {{item.title}}
    </li>
  }
</ul>
